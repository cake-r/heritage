version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ich-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/database.sqlite
      - DEPLOY_ENV=local
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    env_file:
      - ../backend/.env
    volumes:
      - ../backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ich-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
