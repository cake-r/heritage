version: '3.8'

# 云端生产环境配置覆盖
# 用法: docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d --build

services:
  backend:
    environment:
      - DATABASE_URL=postgresql://postgres:${PG_PASSWORD:-postgres}@postgres:5432/ich_platform
      - REDIS_URL=redis://redis:6379/0
      - DEPLOY_ENV=cloud
      - MOCK_MODE=false
    restart: always

  worker:
    environment:
      - DATABASE_URL=postgresql://postgres:${PG_PASSWORD:-postgres}@postgres:5432/ich_platform
      - REDIS_URL=redis://redis:6379/0
      - DEPLOY_ENV=cloud
      - MOCK_MODE=false
    restart: always

  frontend:
    ports:
      - "80:80"
    restart: always
