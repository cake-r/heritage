<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服务暂不可用 — 非遗文创系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #F5F0E8 0%, #EDE4D3 100%);
    }
    .box {
      text-align: center;
      padding: 48px 40px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(26, 26, 46, 0.08);
      max-width: 480px;
    }
    .box h1 {
      font-size: 48px;
      color: #C41E3A;
      margin-bottom: 16px;
    }
    .box p {
      color: #666;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 24px;
    }
    .box a {
      color: #C41E3A;
      text-decoration: none;
      font-weight: 500;
    }
    .box a:hover {
      text-decoration: underline;
    }
    .box .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🏮</div>
    <h1>服务暂不可用</h1>
    <p>抱歉，服务器暂时无法响应，请稍后重试</p>
    <p><a href="javascript:location.reload()">刷新页面</a></p>
  </div>
</body>
</html>
